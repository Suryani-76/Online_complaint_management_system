<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Management Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eaf2f8;
            color: #10213b;
            min-height: 100vh;
        }

        header {
            background: #101a30;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title {
            font-size: 26px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav button {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            transition: all 0.2s;
        }

        .active {
            background: #0d9488;
            color: white;
        }

        .inactive {
            background: transparent;
            color: #aab7c9;
            border: 1px solid transparent;
        }

        .inactive:hover {
            color: white;
            border-color: #334155;
        }

        .container {
            width: 90%;
            max-width: 590px;
            background: white;
            margin: 35px auto;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px #0001;
        }

        .roles {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .roles button {
            flex: 1;
            padding: 12px;
            border: 1px solid #d5e0ee;
            background: white;
            color: #0d9488;
            border-radius: 9px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .roles button:hover {
            background: #f0fdfa;
        }

        .roles button.selected {
            background: #0d9488;
            color: white;
            border-color: #0d9488;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 17px;
            margin: 18px 0 9px;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 1px solid #d5e0ee;
            border-radius: 10px;
            font-size: 16px;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #0d9488;
            background: #ffffff;
        }

        .forgot {
            text-align: right;
            margin: 12px 0 28px;
        }

        .forgot a {
            color: #0d9488;
            text-decoration: none;
            font-weight: bold;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .submit {
            width: 100%;
            padding: 16px;
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit:hover {
            background: #0f766e;
        }

        .submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .register {
            margin-top: 22px;
            text-align: center;
        }

        .register button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: white;
            color: #0d9488;
            border: 1px solid #d5e0ee;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .register button:hover {
            background: #f0fdfa;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #0d9488;
            min-height: 22px;
            font-weight: 500;
        }

        .msg-error {
            color: #e11d48 !important;
        }

        .msg-success {
            color: #0d9488 !important;
        }

        .extra-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #e2e8f0;
        }

        .extra-links a {
            color: #0d9488;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        [dir="rtl"] {
            text-align: right;
        }
        [dir="rtl"] .forgot {
            text-align: left;
        }
    </style>
</head>

<body>

<header>
    <div class="header-title" data-i18n="title">
        Complaint Portal
    </div>

    <nav>
        <button class="active" id="navSignIn" data-i18n="signIn">Sign in</button>
        <button class="inactive" id="navRegister" data-i18n="register">Register</button>
    </nav>
</header>

<div class="container">

    <div class="roles" id="rolesGroup">
        <button type="button" class="selected" data-role="user" data-i18n="user">User</button>
        <button type="button" data-role="admin" data-i18n="admin">Admin</button>
        <button type="button" data-role="officer" data-i18n="officer">Officer</button>
    </div>

    <label data-i18n="language" for="language">Preferred language</label>

    <select id="language">
        <option value="en">English</option>
        <option value="te">తెలుగు</option>
        <option value="hi">हिन्दी</option>
        <option value="ta">தமிழ்</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="ml">മലയാളം</option>
        <option value="mr">मराठी</option>
        <option value="bn">বাংলা</option>
        <option value="gu">ગુજરાતી</option>
        <option value="ur">اردو</option>
    </select>

    <form id="loginForm">

        <label data-i18n="email" for="email">Email</label>
        <input type="email" id="email"
            data-placeholder="emailPlaceholder"
            placeholder="Enter your email" required value="user@demo.in">

        <label data-i18n="password" for="password">Password</label>
        <input type="password" id="password"
            data-placeholder="passwordPlaceholder"
            placeholder="Enter your password" required value="demo">

        <div class="forgot">
            <a href="javascript:void(0)" id="forgotBtn" data-i18n="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="submit" id="submitBtn"
            data-i18n="signIn">
            Sign in
        </button>

    </form>

    <div class="register">
        <p data-i18n="newUser">New user?</p>
        <button type="button" id="registerBtn" data-i18n="register">Register</button>
    </div>

    <p id="message"></p>



</div>

// ROLE DEMO CREDENTIALS
const demoAccounts = {
    user: { email: "user@demo.in", password: "demo" },
    admin: { email: "admin@demo.in", password: "demo" },
    officer: { email: "officer@demo.in", password: "demo" }
};

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const messageEl = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

// ROLE SWITCHING EVENT
document.getElementById("rolesGroup").addEventListener("click", function(e) {
    const btn = e.target.closest("button[data-role]");
    if (!btn) return;

    document.querySelectorAll("#rolesGroup button").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");

    const role = btn.getAttribute("data-role");
    if (demoAccounts[role]) {
        emailInput.value = demoAccounts[role].email;
        passwordInput.value = demoAccounts[role].password;
    }
    messageEl.innerText = "";
});

// LANGUAGE CHANGE FUNCTION
function changeLanguage(lang) {
    const selected = translations[lang] || translations.en;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ur') ? 'rtl' : 'ltr';

    document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.getAttribute("data-i18n");
        if (selected[key]) {
            element.innerText = selected[key];
        }
    });

    document.querySelectorAll("[data-placeholder]").forEach(element => {
        const key = element.getAttribute("data-placeholder");
        if (selected[key]) {
            element.placeholder = selected[key];
        }
    });

    localStorage.setItem("selectedLanguage", lang);
    messageEl.className = "msg-success";
    messageEl.innerText = selected.success;
}

// LANGUAGE DROPDOWN EVENT
const languageDropdown = document.getElementById("language");
languageDropdown.addEventListener("change", function() {
    changeLanguage(this.value);
});

// LOAD SAVED LANGUAGE
const savedLanguage = localStorage.getItem("selectedLanguage") || "en";
languageDropdown.value = savedLanguage;
changeLanguage(savedLanguage);

// FORGOT PASSWORD / REGISTER DEMO HOOKS
document.getElementById("forgotBtn").addEventListener("click", function() {
    alert("Password reset OTP: 123456 (demo). Enter your email and use OTP to reset.");
});
function registerPrompt() {
    alert("New citizen registration is enabled! Use demo accounts or register with demo OTP: 123456.");
}
document.getElementById("registerBtn").addEventListener("click", registerPrompt);
document.getElementById("navRegister").addEventListener("click", registerPrompt);

// CONNECT BACKEND AUTHENTICATION
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const curLang = languageDropdown.value;
    const t = translations[curLang] || translations.en;

    submitBtn.disabled = true;
    submitBtn.innerText = t.signingIn || "Signing in...";
    messageEl.className = "";
    messageEl.innerText = "";

    try {
        const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
            messageEl.className = "msg-success";
            messageEl.innerText = (t.loginSuccess || "Signed in successfully!") + ` [Logged in as ${data.user.name || data.role}]`;
            
            if (data.token) localStorage.setItem("authToken", data.token);
            if (data.user) localStorage.setItem("currentUser", JSON.stringify(data.user));
            if (data.role) localStorage.setItem("userRole", data.role);
            
            setTimeout(() => {
                alert(`Welcome ${data.user.name || 'User'}! You have successfully signed in as ${data.role.toUpperCase()}.`);
                submitBtn.disabled = false;
                submitBtn.innerText = t.signIn;
            }, 500);
        } else {
            messageEl.className = "msg-error";
            messageEl.innerText = data.error || t.loginError || "Email or password is incorrect.";
            submitBtn.disabled = false;
            submitBtn.innerText = t.signIn;
        }
    } catch (err) {
        // Fallback for static browser preview without backend
        if (password === "demo") {
            messageEl.className = "msg-success";
            messageEl.innerText = "Signed in successfully (Demo Mode)!";
            alert(`Signed in successfully with ${email}!`);
        } else {
            messageEl.className = "msg-error";
            messageEl.innerText = "Failed to connect to authentication server. Please check backend.";
        }
        submitBtn.disabled = false;
        submitBtn.innerText = t.signIn;
    }
});

</script>

</body>
</html>
